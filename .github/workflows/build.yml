name: build

# Three things worth checking on every push, none of which need a phone:
#   1. the Android app compiles and its JVM unit tests pass (compileSdk 36, AGP 8.13.2,
#      Kotlin 2.2.21). The bridge codec, the host-service whitelist and the endpoint
#      registry are deliberately free of android.*, so they run on a plain JVM;
#   2. bridge.c compiles for the real guest ABI (armv7, NDK) and its bproto2 framing
#      round-trips against a mock host;
#   3. the mock host's byte layout matches, checked without a socket so it also runs on
#      machines whose Python has no AF_UNIX.
#
# This is also the only place GuestVm.kt / UnixServer.kt / BridgeLink.kt are ever run
# through a compiler: they touch android.* and cannot be built on a workstation without
# the SDK. Everything else in the bridge was already testable off-device.
#
# The runner image already ships the Android SDK (ANDROID_HOME=/usr/local/lib/android/sdk,
# platform 36, build-tools 36.0.0). It is used as-is; only the NDK may need installing,
# which is why there is no android-actions/setup-android step here — it failed on every
# run of this workflow and, on a runner that already has the SDK, had nothing to add.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # gradle.properties pins org.gradle.java.home to the maintainer's Android Studio JBR
  # ("C:/Program Files/Android/Android Studio/jbr"); on a runner that path does not exist
  # and Gradle dies before running anything. Removed in the checkout-normalising step.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  native:
    name: native (armv7 shim + bproto2 host test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: bproto2 host test (host cc, real SOCK_SEQPACKET)
        run: |
          cd native/guestshim
          sh build.sh hosttest
          ./ab_host_test

      - name: mock host byte-layout self-test (python)
        run: |
          cd tools/bridge-mock
          python3 selftest.py

      - name: locate sdkmanager
        id: sdk
        run: |
          # The image puts ANDROID_HOME on the runner, but PATH is not guaranteed to carry
          # cmdline-tools, so resolve sdkmanager once and hand the path to later steps.
          SM=$(command -v sdkmanager || true)
          if [ -z "$SM" ]; then
            for d in "$ANDROID_HOME/cmdline-tools/latest/bin" \
                     "$ANDROID_HOME/cmdline-tools/12.0/bin" \
                     "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"; do
              if [ -x "$d/sdkmanager" ]; then SM="$d/sdkmanager"; break; fi
            done
          fi
          echo "sdkmanager=$SM" >> "$GITHUB_OUTPUT"
          echo "resolved: ${SM:-<none>}"
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: pick an NDK (prefer whatever is already installed)
        id: ndk
        run: |
          # r28 is what the checked-in .so files were built with, so use it when the image
          # happens to have it. Otherwise take the image's default: this step only has to
          # prove bridge.c compiles cleanly for armv7, and it compiles to a scratch dir,
          # never over the shipped binaries. Downloading ~1.5 GB to reproduce a build we
          # do not ship would make the job slow and flaky for no extra coverage.
          for v in 28.2.13676358 28.1.13356709 28.0.13004108; do
            if [ -d "$ANDROID_HOME/ndk/$v" ]; then
              echo "ndk=$ANDROID_HOME/ndk/$v" >> "$GITHUB_OUTPUT"
              echo "using preinstalled NDK $v"
              exit 0
            fi
          done
          if [ -d "$ANDROID_NDK_HOME/toolchains" ]; then
            echo "ndk=$ANDROID_NDK_HOME" >> "$GITHUB_OUTPUT"
            echo "no r28 on the image; using its default NDK at $ANDROID_NDK_HOME"
            exit 0
          fi
          SDK="${{ steps.sdk.outputs.sdkmanager }}"
          for v in 28.2.13676358 28.1.13356709 28.0.13004108; do
            if "$SDK" --install "ndk;$v" > /dev/null 2>&1; then
              echo "ndk=$ANDROID_HOME/ndk/$v" >> "$GITHUB_OUTPUT"
              echo "installed NDK $v"
              exit 0
            fi
          done
          echo "no usable NDK at all" >&2
          exit 1

      - name: compile libaemushim.so for armv7 (bridge.c and all)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
        run: |
          # into a scratch dir: the checked-in libaemushim.so is what ships, this only
          # proves bridge.c compiles with -fvisibility=hidden -nostdlib for the real ABI.
          sh native/guestshim/build.sh "$RUNNER_TEMP/out/libaemushim.so"
          ls -l "$RUNNER_TEMP/out"
          file "$RUNNER_TEMP/out/libaemushim.so" || true

      - name: the guest client is actually exported
        env:
          NDK_DIR: ${{ steps.ndk.outputs.ndk }}
        run: |
          # ab_call/ab_status/ab_last_len must survive -fvisibility=hidden, or the guest
          # links against a shim that silently has no bridge in it.
          NM=$(ls "$NDK_DIR"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm)
          "$NM" -D --defined-only "$RUNNER_TEMP/out/libaemushim.so" | tee "$RUNNER_TEMP/syms.txt"
          for s in ab_call ab_status ab_last_len; do
            grep -q " $s\$" "$RUNNER_TEMP/syms.txt" || { echo "missing export: $s" >&2; exit 1; }
          done

  android:
    name: android (unit tests + assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: locate sdkmanager and confirm the SDK
        run: |
          SM=$(command -v sdkmanager || true)
          if [ -z "$SM" ]; then
            for d in "$ANDROID_HOME/cmdline-tools/latest/bin" \
                     "$ANDROID_HOME/cmdline-tools/12.0/bin"; do
              if [ -x "$d/sdkmanager" ]; then echo "$d" >> "$GITHUB_PATH"; SM="$d/sdkmanager"; break; fi
            done
          fi
          echo "sdkmanager: ${SM:-<none>}"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: install anything the image is missing
        run: |
          # Everything here is normally preinstalled; this only covers a leaner runner.
          SM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          need=""
          [ -d "$ANDROID_HOME/platforms/android-36" ] || need="$need platforms;android-36"
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || need="$need build-tools;36.0.0"
          if [ -n "$need" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            # shellcheck disable=SC2086
            "$SM" --install $need
          else
            echo "platform 36 and build-tools 36.0.0 already present"
          fi

      - name: rebuild aemu-stubs.jar and compare it with the checked-in one
        run: |
          # The jar is the only guest-side consumer of bproto2 (BridgeStub), and until now
          # nothing rebuilt it but a human with a workstation. Build it into a scratch dir and
          # require that it still compiles.
          #
          # The comparison is "the shipped jar's classes are all still there", not a byte or even
          # a set equality check: the dex is produced by whatever d8 the image ships, which is a
          # different version than the one that built the checked-in jar, and a newer d8 is free
          # to emit different synthetic classes. What must not happen is a stub disappearing from
          # the build while the jar in git keeps it.
          sh native/gueststubs/build.sh "$RUNNER_TEMP/out/aemu-stubs.jar"
          ls -l "$RUNNER_TEMP/out/aemu-stubs.jar"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          HERE=$(pwd)
          for side in built shipped; do
            case $side in
              built)   JAR="$RUNNER_TEMP/out/aemu-stubs.jar" ;;
              shipped) JAR="$HERE/app/src/main/assets/engines/kk/aemu-stubs.jar" ;;
            esac
            rm -rf "$RUNNER_TEMP/$side" && mkdir -p "$RUNNER_TEMP/$side"
            ( cd "$RUNNER_TEMP/$side" && unzip -o -q "$JAR" classes.dex )
            "${BT}dexdump" -f "$RUNNER_TEMP/$side/classes.dex" \
              | grep 'Class descriptor' | sed 's/^ *//' | sort -u > "$RUNNER_TEMP/$side.txt"
          done
          comm -23 "$RUNNER_TEMP/shipped.txt" "$RUNNER_TEMP/built.txt" > "$RUNNER_TEMP/missing.txt" || true
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            echo "classes in the checked-in jar that the build no longer produces:" >&2
            cat "$RUNNER_TEMP/missing.txt" >&2
            exit 1
          fi
          # and the bridge stub has to be in it, or the shipped jar predates the guest client
          grep -q "app/aemu/stub/BridgeStub" "$RUNNER_TEMP/built.txt"
          echo "guest stubs rebuilt: $(wc -l < "$RUNNER_TEMP/built.txt") classes"

      - name: gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: drop the local Android Studio JBR path
        run: |
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          grep -c 'org\.gradle\.java\.home' gradle.properties || echo "pinned JBR path removed"

      # Gradle output is the only place a compile error can explain itself, and this job's log
      # needs admin rights to download — while check-run annotations are readable by anyone.
      # So every run tees gradle to a file, and the next step republishes the interesting lines
      # as annotations. Without this the workflow fails with a bare "exit code 1".
      - name: unit tests
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:testStandardDebugUnitTest 2>&1 \
            | tee "$RUNNER_TEMP/gradle.log"
          rc=${PIPESTATUS[0]}
          echo "gradle exit $rc"
          exit "$rc"

      - name: surface the failure as annotations
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/gradle.log"
          ERR="$RUNNER_TEMP/errs.txt"
          : > "$ERR"
          [ -f "$LOG" ] || exit 0

          # Kotlin/Java compile errors: "e: file:///.../X.kt:42:7 message"
          grep -aE '^e: file:///' "$LOG" | head -40 >> "$ERR" || true
          # javac style: "/path/X.java:42: error: message"
          grep -aE '^/.*\.java:[0-9]+: error:' "$LOG" | head -20 >> "$ERR" || true
          # anything gradle itself rejected, plus failing tasks and failing tests
          grep -aE '^(FAILURE: |\* What went wrong:|> Task .* FAILED|.*> .*FAILED$)' "$LOG" | head -20 >> "$ERR" || true
          grep -aE '^\s+[A-Za-z0-9_.]+ > [A-Za-z0-9_]+ FAILED' "$LOG" | head -20 >> "$ERR" || true

          if [ ! -s "$ERR" ]; then
            # No recognisable error line: publish the tail so the message is not empty.
            tail -30 "$LOG" > "$ERR"
            mode=tail
          else
            mode=parsed
          fi

          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            esc=${line//'%'/'%25'}
            esc=${esc//$'\r'/}
            esc=${esc//$'\n'/'%0A'}
            if [ "$mode" = parsed ]; then
              file=$(printf '%s' "$line" | sed -n 's|^e: file://\([^:]*\):\([0-9]*\):.*|\1|p')
              ln=$(printf '%s' "$line" | sed -n 's|^e: file://[^:]*:\([0-9]*\):.*|\1|p')
            else
              file=""; ln=""
            fi
            if [ -n "$file" ]; then
              echo "::error file=$file,line=${ln:-1}::$esc"
            else
              echo "::error::$esc"
            fi
            n=$((n + 1))
            [ "$n" -ge 25 ] && break
          done < "$ERR"
          echo "published $n annotation line(s) from $mode"

      - name: assemble debug
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --console=plain :app:assembleStandardDebug 2>&1 \
            | tee "$RUNNER_TEMP/gradle-assemble.log"
          rc=${PIPESTATUS[0]}
          echo "gradle exit $rc"
          exit "$rc"

      - name: upload unit test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: upload apk
        uses: actions/upload-artifact@v5
        with:
          name: aemu-standard-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
