name: build

# Three things are worth checking on every push, and none of them need a phone:
#   1. the Android app compiles (compileSdk 36 + AGP 8.13.2 + Kotlin 2.2.21),
#   2. the JVM unit tests pass — the bridge codec, the host-service whitelist and the
#      endpoint registry are deliberately free of android.*, so they run on a plain JVM,
#   3. bridge.c compiles for the real guest ABIs (armv7 with the NDK) and its bproto2
#      framing round-trips against a mock host. The host test is also run here, on Linux,
#      where it can use SOCK_SEQPACKET for real instead of the SOCK_STREAM fallback.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: native (armv7 shim + bproto2 host test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bproto2 host test (gcc, SOCK_SEQPACKET)
        run: |
          cd native/guestshim
          sh build.sh hosttest
          ./ab_host_test

      - name: mock host byte-layout self-test (python)
        run: |
          cd tools/bridge-mock
          python3 selftest.py

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install an NDK r28
        id: ndk
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # r28c, then r28b, then r28: whichever this SDK repository actually offers.
          # Pinned by hand would break silently when a mirror lags.
          for v in 28.2.13676358 28.1.13356709 28.0.13004108; do
            if sdkmanager --install "ndk;$v" > /dev/null 2>&1; then
              echo "ndk=$ANDROID_HOME/ndk/$v" >> "$GITHUB_OUTPUT"
              echo "installed NDK $v"
              exit 0
            fi
          done
          echo "no NDK r28 available from this SDK repository" >&2
          exit 1

      - name: compile libaemushim.so for armv7 (bridge.c and all)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk }}
        run: |
          # into a scratch dir: the checked-in libaemushim.so is what ships, this only
          # proves bridge.c compiles with -fvisibility=hidden -nostdlib for the real ABI.
          sh native/guestshim/build.sh "$RUNNER_TEMP/out/libaemushim.so"
          ls -l "$RUNNER_TEMP/out"
          file "$RUNNER_TEMP/out/libaemushim.so" || true

      - name: the guest client is actually exported
        run: |
          # ab_call/ab_status/ab_last_len must survive -fvisibility=hidden, or the guest
          # links against a shim that silently has no bridge in it.
          NM=$(ls "${{ steps.ndk.outputs.ndk }}"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm)
          "$NM" -D --defined-only "$RUNNER_TEMP/out/libaemushim.so" | tee "$RUNNER_TEMP/syms.txt"
          for s in ab_call ab_status ab_last_len; do
            grep -q " $s\$" "$RUNNER_TEMP/syms.txt" || { echo "missing export: $s" >&2; exit 1; }
          done

  android:
    name: android (unit tests + assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: drop the local Android Studio JBR path
        run: |
          # gradle.properties pins org.gradle.java.home to the maintainer's machine
          # ("C:/Program Files/Android/Android Studio/jbr"), which does not exist on a
          # runner and is a hard failure. Here the JDK comes from setup-java instead.
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: unit tests
        run: ./gradlew --no-daemon :app:testStandardDebugUnitTest

      - name: assemble debug
        run: ./gradlew --no-daemon :app:assembleStandardDebug

      - name: upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/**
          if-no-files-found: ignore

      - name: upload apk
        uses: actions/upload-artifact@v4
        with:
          name: aemu-standard-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
